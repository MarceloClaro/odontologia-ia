name: Panoramica Streamlit CI

on:
  pull_request:
    paths:
      - "streamlit_app/**"
      - ".github/workflows/panoramica-streamlit-ci.yml"
  push:
    branches: [main]
    paths:
      - "streamlit_app/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamlit_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Syntax check
        run: python -m compileall app.py core
